<!doctype html><html lang="en"><meta charset="utf-8"><title>Blockhaven rendering verification</title><style>body{margin:0;background:#dbe3d8;font:14px system-ui;color:#23484a}canvas{width:100%;height:75vh;display:block}#results{padding:20px;line-height:1.8;white-space:pre-wrap}</style><canvas id="render"></canvas><pre id="results">Running deterministic scene checks…</pre><script type="module">
import {createCityScene} from './scene.mjs';import {newCity,N,STYLES,CATALOG,land}from'./model.mjs';
const results=document.getElementById('results'),settings={quality:'balanced',lighting:'day',reducedMotion:false},state=newCity();let checks=0;const check=(v,s)=>{if(!v)throw Error(s);checks++;results.textContent+='\nPASS '+s};
try{
 const v=createCityScene(document.getElementById('render'),()=>state,()=>settings);v.renderer.setSize(1000,650,false);v.camera.aspect=1000/650;v.camera.updateProjectionMatrix();v.camera.position.set(150,190,200);v.camera.lookAt(0,0,0);
 let k=0;state.grid.forEach((t,i)=>{if(t.type!=='hall'){t.type=null;t.pop=0;t.age=0}if(i%N>=5&&i%N<23&&Math.floor(i/N)>=5&&Math.floor(i/N)<23&&land(i%N,Math.floor(i/N))){const styles=Object.keys(STYLES),types=Object.keys(CATALOG).filter(x=>x!=='demolish');t.type=types[k%types.length];t.style=styles[Math.floor(k/types.length)%styles.length];t.density=['low','medium','high'][k%3];t.roadKind=['street','boulevard','oneway','pedestrian','bridge'][k%5];if(t.type==='home')t.pop=k%2?24:0;k++}});v.rebuild();v.update(.016,1,false);await v.renderer.compileAsync(v.scene,v.camera);v.renderer.render(v.scene,v.camera);check(v.blocks.size>500,'large scene builds');check(v.renderer.info.render.calls<1500,'batched draw count stays below 1,500');check(v.renderer.getContext().getError()===0,'no WebGL errors');
 let finite=true;v.blocks.forEach(g=>g.traverse(o=>{if(o.isMesh&&o.geometry){for(const p of o.geometry.attributes.position.array)if(!Number.isFinite(p))finite=false}}));check(finite,'all generated geometry coordinates are finite');
 settings.lighting='night';v.update(.1,1,false);v.renderer.render(v.scene,v.camera);let lit=0;v.scene.traverse(o=>{if(o.isMesh&&o.material.emissiveIntensity>1)lit++});check(lit>0,'night windows and lamps emit light');
 const roads=state.grid.filter(t=>t.type==='road').length;check(v.stats().streetlamps>=roads,'every road block has streetlights');check(v.stats().activeStreetLights===8&&v.stats().pavementLight>0,'night has real local lighting and pavement falloff');
 settings.lighting='day';v.update(.1,1,false);check(v.stats().activeStreetLights===0&&v.stats().pavementLight===0,'street lighting switches off during daylight');settings.lighting='night';v.update(.1,1,false);
 const angle=v.rotors[0]?.mesh.rotation.z;settings.reducedMotion=true;v.update(.1,1,false);check(v.rotors[0]?.mesh.rotation.z===angle,'reduced motion stops turbines');settings.reducedMotion=false;v.celebrate();check(v.stats().balloons===4&&v.stats().effects>0,'celebration launches balloons and particles');v.update(23,1,false);check(v.stats().balloons===0&&v.stats().effects===0,'celebration releases temporary effects');
 let i=state.grid.findIndex((t,i)=>t.type!=='hall'&&land(i%N,Math.floor(i/N)));const x=i%N,y=Math.floor(i/N),styles=Object.keys(STYLES);let warmed,after;Object.assign(state.grid[i],{type:'home',style:'heritage',pop:0});v.createBlock(x,y,true);check(v.blocks.get(i).scale.y<1,'new construction starts an animation');v.update(.4,1,false);check(v.blocks.get(i).scale.y>0&&v.blocks.get(i).scale.y<1,'construction progresses between frames');v.update(.5,1,false);check(v.blocks.get(i).scale.y===1,'construction settles at full size');
 for(let j=0;j<52;j++){Object.assign(state.grid[i],{type:j%3===0?'home':j%3===1?'shop':'office',style:styles[j%styles.length],density:j%2?'medium':'high',pop:20});v.createBlock(x,y,j%2===0);v.update(.9,1,false);v.update(.01,1,false);v.renderer.render(v.scene,v.camera);await new Promise(requestAnimationFrame);if(j===30)warmed=v.renderer.info.memory.geometries;if(j===51)after=v.renderer.info.memory.geometries}
 check(after-warmed<20,'repeated construction does not accumulate obsolete geometry');check(v.renderer.getContext().getError()===0,'stress rendering has no WebGL errors');
 state.grid=newCity().grid;v.rebuild();v.update(.01,1,false);const car=v.cars[0];check(!!car,'connected roads spawn traffic');if(car){const old=car.progress;v.update(.1,1,false);check(car.progress===old,'paused simulation stops traffic');v.update(.1,1,true);check(car.progress!==old,'running simulation moves traffic')}
 check(v.renderer.info.render.triangles>10000,'scene contains substantive 3D geometry');results.textContent+='\n\nALL '+checks+' RENDER CHECKS PASSED\n'+JSON.stringify({drawCalls:v.stats().drawCalls,triangles:v.stats().triangles,geometries:v.stats().geometries,textures:v.stats().textures});document.body.dataset.result='passed';
}catch(e){results.textContent+='\nFAIL '+e.stack;document.body.dataset.result='failed';console.error(e)}
</script></html>
